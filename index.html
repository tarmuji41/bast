<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bast</title>
    <style>
        /* Menghilangkan margin bawaan browser agar iframe benar-benar penuh */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah double scrollbar */
            background-color: #f4f4f9; /* Warna latar belakang cadangan */
        }

        /* Mengatur iframe agar memenuhi seluruh layar */
        iframe {
            width: 100%;
            height: 100%;
            border: none; /* Menghilangkan garis tepi iframe */
            display: block; /* Menghilangkan celah kosong di bagian bawah */
        }
    </style>
</head>
<body>

    <!-- Ganti URL di dalam src="..." dengan link Google Apps Script Anda -->
